<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birthday Card</title>
<style>
@font-face{font-family:"Hand";src:url(fonts/hand.woff) format("woff");font-display:swap}
@font-face{font-family:"Label";src:url(fonts/mono.woff) format("woff");font-display:swap;font-weight:700}

:root{
  --kraft:#b98f6b; --kraft-deep:#8c6544; --cream:#f1e2c6; --cream-2:#e6d0aa;
  --red:#a3161d; --red-deep:#6f0b10; --ink:#4a1f1a; --shadow:rgba(52,24,10,.45);
  --hand:"Hand","Bradley Hand","Segoe Script",cursive;
  --label:"Label","Courier New",ui-monospace,monospace;
  --pw:300px; --ph:424px; --s:1; --barh:68px; --toppad:36px;
  --ease:cubic-bezier(.65,.05,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background-color:var(--kraft);
  background-image:
    radial-gradient(120% 90% at 50% 40%,rgba(255,236,205,.22),rgba(60,28,10,.38) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'><filter id='k' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.011 0.016' numOctaves='5' seed='11' stitchTiles='stitch'/><feDiffuseLighting lighting-color='%23d2a781' surfaceScale='2.4' diffuseConstant='1.02'><feDistantLight azimuth='225' elevation='60'/></feDiffuseLighting></filter><rect width='100%25' height='100%25' filter='url(%23k)'/></svg>");
  background-size:cover,800px 800px;
  color:var(--ink);font-family:var(--label);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;
}
#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-top:var(--toppad);padding-bottom:var(--barh)}
#bookwrap{perspective:2600px;width:100%;display:flex;justify-content:center}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);flex:none;
  transform-style:preserve-3d;
  transform:scale(var(--s)) translateX(calc(var(--pw)*-.5));
  transition:transform 1.1s var(--ease)}
#book.open{transform:scale(1) translateX(0px)}

.page,.face{position:absolute;top:0;width:var(--pw);height:var(--ph);overflow:visible;background:var(--cream);
  box-shadow:0 18px 40px var(--shadow),0 2px 6px rgba(40,18,8,.3);border-radius:2px;container-type:inline-size}
.page img.bg,.face img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;border-radius:2px}
#rightpage{left:50%;pointer-events:none}
body.is-open #rightpage{pointer-events:auto}
body:not(.is-open) #rightpage *{pointer-events:none!important}
#leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-origin:0 50%;
  transform:translateZ(2px);transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
#book.open #leaf{transform:translateZ(2px) rotateY(-180deg)}
.face{left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#cover{cursor:pointer;outline:none;padding:0;border:0;display:block;transition:filter .25s}
#cover:hover,#cover:focus-visible{filter:brightness(1.05) saturate(1.05)}
#cover:focus-visible{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--red),0 18px 40px var(--shadow)}
#book.open #cover{pointer-events:none}
#leftpage{transform:rotateY(180deg)}
/* spine crease */
#rightpage::before,#leftpage::before{content:"";position:absolute;top:0;bottom:0;width:9%;z-index:20;pointer-events:none}
#rightpage::before{left:0;background:linear-gradient(90deg,rgba(40,15,5,.38),rgba(40,15,5,.08) 55%,transparent)}
#leftpage::before{right:0;background:linear-gradient(270deg,rgba(40,15,5,.38),rgba(40,15,5,.08) 55%,transparent)}

/* ---------- left page: envelope + letter ---------- */
#envbg{z-index:1}
#letter{position:absolute;z-index:2;left:10.47%;top:24%;width:59.9%;height:62%;cursor:pointer;outline:none;
  container-type:inline-size;transform-origin:50% 50%;
  transition:transform .75s var(--ease),filter .5s}
#letter img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#letter:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
#letter.up{filter:drop-shadow(0 .9em 1.1em rgba(35,12,4,.5))}
#envfront{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;display:block}
#leftpage.zoomed .tag{opacity:0}
#dim{position:absolute;inset:0;z-index:4;background:rgba(40,14,6,.42);opacity:0;pointer-events:none;transition:opacity .6s;border-radius:2px}
#leftpage.lifted #dim{opacity:1}
.tag{position:absolute;z-index:31;transition:opacity .3s;left:50%;bottom:3.4%;transform:translateX(-50%) rotate(-1.5deg);
  font:700 clamp(7px,2.5cqw,13px)/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--red);
  background:var(--cream);padding:.9em 1.3em;white-space:nowrap;pointer-events:none;
  clip-path:polygon(0 8%,4% 0,12% 6%,22% 0,34% 5%,48% 0,60% 6%,74% 0,88% 5%,96% 0,100% 10%,98% 55%,100% 92%,90% 100%,74% 94%,58% 100%,40% 95%,24% 100%,10% 95%,2% 100%,0 88%,2% 50%);
  animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-50%) rotate(-1.5deg) translateY(-3px)}}

/* ---------- right page: candles ---------- */
#flames,#smoke{position:absolute;inset:0;pointer-events:none;z-index:5}
.glow{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,205,110,.55),rgba(255,150,60,.18) 45%,transparent 70%);
  mix-blend-mode:screen;transition:opacity .25s}
.flame{position:absolute;width:6.79%;transform-origin:50% 90%;transition:opacity .16s}
.flame img{display:block;width:100%;pointer-events:none}
.flame.out{opacity:0}
.flame.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;scale:.15}to{opacity:1;scale:1}}
.puff{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(250,243,232,.8),rgba(250,243,232,0) 70%);
  animation:rise 1.9s ease-out forwards;filter:blur(1.5px)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-380%) scale(2.4)}}

#wish{position:absolute;z-index:8;left:23%;width:54%;top:47%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;
  padding:6cqw 4cqw 5.5cqw;text-align:center;font-family:var(--hand);color:var(--red);
  background:linear-gradient(160deg,#f6e9cf,#ead7b3);box-shadow:0 8px 18px rgba(50,20,8,.35);
  clip-path:polygon(0 3%,5% 0,14% 2%,27% 0,41% 3%,55% 0,70% 2%,84% 0,95% 3%,100% 1%,99% 40%,100% 78%,98% 100%,86% 97%,70% 100%,52% 97%,36% 100%,20% 97%,8% 100%,0 98%,1% 60%);
  transform:rotate(-2.5deg) scale(.5);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,1.5,.4,1),opacity .3s}
#wish.show{transform:rotate(-2.5deg) scale(1);opacity:1;pointer-events:auto}
#wish .w1{font-size:6.6cqw;line-height:1;white-space:nowrap}
#relight{font:700 clamp(7px,2.5cqw,13px)/1 var(--label);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  color:var(--cream);background:var(--red);border:0;padding:.95em 1.5em;margin-top:.5em;border-radius:99px}
#relight:hover{background:var(--red-deep)}

/* ---------- control bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--barh);display:flex;align-items:center;justify-content:center;
  gap:10px 14px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
